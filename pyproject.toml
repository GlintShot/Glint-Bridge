[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glint-bridge"
version = "0.1.0"
description = "Glint Bridge - ADB screenshots + agent-driven crawl for Android apps. Real device pixels only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "websockets>=12.0",
]

[project.optional-dependencies]
crawl = ["Appium-Python-Client>=4.0"]
web = ["playwright>=1.40"]
ai = ["Pillow>=10.0"]

[project.scripts]
glint-bridge = "bridge.main:main"

[project.urls]
Homepage = "https://github.com/GlintShot/Glint-Bridge"

[tool.setuptools.packages.find]
include = ["bridge*"]
